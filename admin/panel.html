<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Pinezka – panel autora</title><link rel="stylesheet" href="/fonts.css">
<style>
:root{--p:#f3e8cf;--t:#3b2a1a;--s:#8a7658;--l:#cdb98f;--c:#b03a2e;--n:#2e5c8a;--g:#5b8c3e}
*{box-sizing:border-box}body{margin:0;background:#4a2f1b;font-family:'IBM Plex Mono',monospace;color:var(--t);font-size:13px}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;color:var(--p);flex-wrap:wrap}header b{letter-spacing:.2em}
header .info{font-size:11px;color:#e3cfa6}header .info.zle{color:#ff9b8f;font-weight:600}
nav{margin-left:auto;display:flex;gap:6px}nav button,button{font-family:inherit;cursor:pointer;border:1px solid var(--t);background:var(--p);color:var(--t);padding:6px 12px;font-size:12px}
nav button.akt{background:var(--c);color:#fff;border-color:var(--c)}
main{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.karta{background:var(--p);padding:14px 16px;margin-bottom:10px;box-shadow:0 4px 14px #0006}
.karta h3{margin:0 0 6px;font-size:13px}.meta{font-size:10px;color:var(--s);letter-spacing:.06em;margin-bottom:6px}
.typ{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border:1px solid;margin-right:6px}.typ.brak{color:var(--n)}.typ.blad{color:var(--c)}
.tekst{white-space:pre-wrap;background:#fffaf0;border-left:3px solid var(--l);padding:6px 10px;margin:6px 0}
.dz{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}select,input{font-family:inherit;font-size:12px;padding:5px;border:1px solid var(--t);background:#fffaf0}
.ok{opacity:.5}.fil{display:flex;gap:8px;margin:0 0 10px;color:var(--p);align-items:center}
.wyb{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.wyb span{font-size:11px;padding:2px 6px;border:1px solid var(--l);background:#fffaf0}
.wyb span.dobry{border-color:var(--g);color:var(--g)}.wyb span.zly{border-color:var(--c);color:var(--c);cursor:pointer}.wyb span.zly:hover{background:#f6d8d2}
table{width:100%;border-collapse:collapse}td,th{padding:5px 8px;border-bottom:1px dashed var(--l);text-align:left;font-size:12px}
#login{max-width:360px;margin:80px auto}#login input{width:100%;margin:10px 0;padding:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--p);padding:10px 18px;display:none}
</style></head><body>
<header><b>PINEZKA · PANEL AUTORA</b><span class="info" id="info"></span><nav id="nav" hidden><button data-t="zg" class="akt">Zgłoszenia</button><button data-t="dni">Dni i wybory</button><button data-t="pyt">Pytania</button><button id="wyloguj">Wyloguj</button></nav></header>
<main id="main"><div id="login" class="karta"><h3>Klucz autora</h3><form id="lf"><input id="klucz" type="password" autocomplete="current-password" placeholder="ADMIN_KEY"><button>Wejdź</button></form><div id="lerr" class="meta"></div></div></main>
<div class="toast" id="toast"></div>
<script src="ADMIN_JS"></script>
</body></html>
